name: Windows x64
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CC: gcc
    steps:
      - uses: actions/checkout@v7
        with:
          path: luce
      # luce-base and every package the tests depend on, at main (docs/CI.md)
      - uses: actions/checkout@v7
        with:
          repository: dymokomi/luce-base
          path: luce-base
      - name: Check out dependencies at main
        shell: bash
        run: python luce-base/tools/checkout_main.py luce
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-vulkan-devel
      - name: Build Base
        working-directory: luce-base
        shell: msys2 {0}
        run: python tools/build_windows.py
      - name: Build Luce
        working-directory: luce
        shell: msys2 {0}
        run: python tools/build_windows.py
      - name: Run Windows contracts
        working-directory: luce
        shell: msys2 {0}
        run: |
          python tools/test_windows.py
          python tools/test_windows_paths.py
          python tools/test_sandbox.py
          python tools/test_toolchain_choice.py
          python tools/test_build_cache.py
          # the compile budget with both compilers named relative to here, a Luce entry first
          python ../luce-base/tools/compile_budget.py --compiler ../luce-base/build/luce-base.exe --luce build/luce.exe --seconds 240 --megabytes 2048 tests/programs/calc/main.luc
          ../luce-base/build/luce-base.exe test src/main.lucb
          ../luce-base/build/luce-base.exe test src/main.lucb --backend=c
      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: luce-windows-${{ github.sha }}
          path: |
            luce/build/*.log
            luce/build/*results.json
