name: Release
# A tag `luce-VERSION` on a green main becomes a GitHub release with one archive per host:
# `luce` with the Base compiler built from luce-base's main bundled beside it, luc from
# luce-luc's main and Base's standard library, each proved by tools/install_smoke.sh before
# it is published: what the installers at luce.luciaos.com download. A release is cut from
# the current mains; package.prisma versions, not commit pins, fix what it is (docs/CI.md).
on:
  push:
    tags: ['luce-*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unix:
    name: Package (${{ matrix.host }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            host: arm64-macos
          # the oldest supported runner, so the compilers run on that glibc and newer
          - runner: ubuntu-22.04
            host: x86_64-linux
          - runner: ubuntu-22.04-arm
            host: arm64-linux
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag names this version
        if: github.ref_type == 'tag'
        run: |
          [ "${GITHUB_REF_NAME#luce-}" = "$(tr -d '[:space:]' < VERSION)" ] || { echo "the tag does not name VERSION"; exit 1; }
      - name: Check out luce-base, luc and their dependencies at main
        run: |
          git clone -q --depth 1 https://github.com/dymokomi/luce-base.git ../luce-base
          python3 ../luce-base/tools/checkout_main.py . ../luce-luc
      - name: Build with luce-base's main
        run: ./build.sh
      - name: Package
        run: tools/package.sh build/release
      - name: Prove the archive
        run: tools/install_smoke.sh build/release/luce-*-${{ matrix.host }}.tar.gz build/smoke
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.host }}
          path: build/release/luce-*
  windows:
    name: Package (x86_64-windows)
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    env:
      CC: gcc
    steps:
      - uses: actions/checkout@v7
        with:
          path: luce
      - uses: actions/checkout@v7
        with:
          repository: dymokomi/luce-base
          path: luce-base
      - name: Check out luc and the dependencies at main
        shell: bash
        run: python luce-base/tools/checkout_main.py luce luce-luc
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python
            git
      - name: Check the tag names this version
        if: github.ref_type == 'tag'
        working-directory: luce
        run: |
          [ "${GITHUB_REF_NAME#luce-}" = "$(tr -d '[:space:]' < VERSION)" ] || { echo "the tag does not name VERSION"; exit 1; }
      - name: Build Base
        working-directory: luce-base
        run: python tools/build_windows.py
      - name: Build Luce
        working-directory: luce
        run: python tools/build_windows.py
      - name: Package
        working-directory: luce
        run: sh tools/package.sh build/release
      - name: Prove the archive
        working-directory: luce
        run: sh tools/install_smoke.sh build/release/luce-*-x86_64-windows.tar.gz build/smoke
      - uses: actions/upload-artifact@v4
        with:
          name: x86_64-windows
          path: luce/build/release/luce-*
  publish:
    name: Publish the release
    needs: [unix, windows]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "luce ${GITHUB_REF_NAME#luce-} with its Base compiler bundled: one archive per host, installed by https://luce.luciaos.com."
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber release/luce-*
