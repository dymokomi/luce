name: Correctness
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'
permissions:
  contents: read
jobs:
  gate:
    name: Gate (${{ matrix.host }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            host: arm64-macos
          - runner: ubuntu-24.04
            host: x86_64-linux
          - runner: ubuntu-24.04-arm
            host: arm64-linux
    defaults:
      run:
        shell: bash
        working-directory: luce
    env:
      CC: clang
      CXX: clang++
      LUCE_CI_HOST: ${{ matrix.host }}
      LUCE_TEST_GPU: optional
    steps:
      - uses: actions/checkout@v7
        with:
          path: luce
          fetch-depth: 0
      # luce-base and every package the tests depend on, at main (docs/CI.md); build.sh
      # builds ../luce-base
      - name: Check out dependencies at main
        run: |
          git clone -q --depth 1 https://github.com/dymokomi/luce-base.git ../luce-base
          python3 ../luce-base/tools/checkout_main.py .
      - name: Install valgrind for the cycle collector stress run
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Select Clang for generated C
        run: |
          mkdir -p "$RUNNER_TEMP/luce-bin"
          ln -s "$(command -v clang)" "$RUNNER_TEMP/luce-bin/cc"
          echo "$RUNNER_TEMP/luce-bin" >> "$GITHUB_PATH"
      - name: Record toolchain and dependency provenance
        run: |
          mkdir -p build
          python3 tools/ci_provenance.py | tee build/provenance.json
      - name: Run the gate
        run: |
          set -o pipefail
          ./test.sh 2>&1 | tee build/gate.log
      # the fuzzing generators for longer on x86-64, where the arm64 campaigns do not run
      - name: Differential and cycle-collector fuzzing, 15 minutes each
        if: matrix.host == 'x86_64-linux'
        run: |
          python3 tools/fuzz.py --seed ${{ github.run_number }} --minutes 15
          python3 tools/cycles_fuzz.py --seed ${{ github.run_number }} --minutes 15
      - name: Diagnose a failed Linux bootstrap
        if: failure() && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gdb
          bash tools/ci_backtrace.sh
      - name: Record final dependency provenance
        if: always()
        run: |
          mkdir -p build
          python3 tools/ci_provenance.py > build/provenance-final.json
      - name: Retain diagnostics and replay records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: luce-${{ matrix.host }}-${{ github.sha }}
          path: |
            luce/build/*.log
            luce/build/conformance.out
            luce/build/conformance.err
            luce/build/conformance.base/
            luce-base/build/*.log
            luce/build/provenance*.json
            luce/build/failures/
            luce/build/fuzz/
            luce/build/cycles_fuzz/
            luce/build/hardware-skip.txt
          retention-days: 14
