name: Correctness
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'
permissions:
  contents: read
jobs:
  gate:
    name: Gate (${{ matrix.host }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            host: arm64-macos
          - runner: ubuntu-24.04
            host: x86_64-linux
    defaults:
      run:
        shell: bash
        working-directory: luce
    env:
      CC: clang
      CXX: clang++
      LUCE_CI_HOST: ${{ matrix.host }}
      LUCE_TEST_GPU: optional
    steps:
      - uses: actions/checkout@v7
        with:
          path: luce
          fetch-depth: 0
      - name: Fetch the pinned Base release
        run: git clone --depth 1 --branch "$(cat bootstrap/BASE)" https://github.com/dymokomi/luce-base.git ../luce-base
      - name: Select Clang for generated C
        run: |
          mkdir -p "$RUNNER_TEMP/luce-bin"
          ln -s "$(command -v clang)" "$RUNNER_TEMP/luce-bin/cc"
          echo "$RUNNER_TEMP/luce-bin" >> "$GITHUB_PATH"
      - name: Record toolchain and dependency provenance
        run: |
          mkdir -p build
          python3 tools/ci_provenance.py | tee build/provenance.json
      - name: Run the gate
        run: |
          set -o pipefail
          ./test.sh 2>&1 | tee build/gate.log
      - name: Diagnose a failed Linux bootstrap
        if: failure() && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gdb
          bash tools/ci_backtrace.sh
      - name: Record final dependency provenance
        if: always()
        run: |
          mkdir -p build
          python3 tools/ci_provenance.py > build/provenance-final.json
      - name: Retain diagnostics and replay records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: luce-${{ matrix.host }}-${{ github.sha }}
          path: |
            luce/build/*.log
            luce/build/conformance.out
            luce/build/conformance.err
            luce/build/conformance.base/
            luce/build/luce-base/build/*.log
            luce/build/provenance*.json
            luce/build/failures/
            luce/build/fuzz/
            luce/build/hardware-skip.txt
          retention-days: 14
