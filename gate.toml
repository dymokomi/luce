# What the gate runs on each platform (luce-base tools/gate.py, docs/CI.md): bash commands
# in this checkout, in order, beside its dependencies at main, with LUCE_BASE naming the
# Base compiler and build/luce the Luce compiler the gate built from this commit. luc goes
# into the release archive.
tools = ["luce-luc"]

# The default level runs `./test.sh --quick`; --full runs all of it and the longer fuzzing.
[macos]
steps = ["./test.sh $([ \"$LUCE_GATE_LEVEL\" = full ] || echo --quick)"]

[linux]
steps = ["./test.sh $([ \"$LUCE_GATE_LEVEL\" = full ] || echo --quick)"]
# differential and cycle-collector fuzzing
full = [
    "python3 tools/fuzz.py --seed $RANDOM --minutes 5",
    "python3 tools/cycles_fuzz.py --seed $RANDOM --minutes 5",
]

[windows]
steps = [
    """
    python tools/test_windows.py
    python tools/test_windows_paths.py
    python tools/test_sandbox.py
    python tools/test_toolchain_choice.py
    python tools/test_build_cache.py
    """,
    "../luce-base/build/luce-base.exe test src/main.lucb",
    "../luce-base/build/luce-base.exe test src/main.lucb --backend=c",
]
full = [
    # the compile budget with both compilers named relative to here, a Luce entry first
    "python ../luce-base/tools/compile_budget.py --compiler ../luce-base/build/luce-base.exe --luce build/luce.exe --seconds 240 --megabytes 2048 tests/programs/calc/main.luc",
]

# after a full pass: the archive the installers download (luce, luce-base, luc and the standard
# library), proved where it is unpacked, kept for luce-base tools/release.py
[release]
steps = [
    "LUCE_BASE_BUILD=../luce-base/build tools/package.sh build/release",
    "tools/install_smoke.sh build/release/luce-$(tr -d '[:space:]' < VERSION)-$LUCE_GATE_HOST.tar.gz build/smoke",
]
files = ["build/release/luce-*"]
